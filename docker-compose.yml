services:
  buddy:
    image: zljiscx/buddysignin:latest
    container_name: buddy-signin
    restart: unless-stopped
    ports:
      # 左边是宿主机端口，被占用就改这个数字；右边是容器内固定端口，别动
      - "18321:18321"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 账号、token、状态、日志、设置全部在这个目录
      - ./data:/app/data
