<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Buddy 签到管理台</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-size:14px}
  .box{background:#fff;border:1px solid #e6e8eb;border-radius:12px;padding:32px;width:min(360px,100%);
       box-shadow:0 6px 28px rgba(31,35,41,.06)}
  h1{font-size:18px;font-weight:600;margin-bottom:6px}
  .sub{color:#8a9099;font-size:12px;margin-bottom:24px}
  label{display:block;font-size:12px;color:#697078;margin-bottom:6px}
  input{width:100%;border:1px solid #d9dde3;border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit;
        outline:none;transition:.15s}
  input:focus{border-color:#1664ff;box-shadow:0 0 0 3px rgba(22,100,255,.12)}
  button{margin-top:18px;width:100%;border:none;background:#1664ff;color:#fff;padding:11px;border-radius:8px;
         font-size:14px;cursor:pointer;font-family:inherit}
  button:hover{background:#0e54dd}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{display:{{SHOW_ERR}};color:#b3261e;font-size:12px;margin-top:12px}
  .hint{display:{{SHOW_HINT}};background:#fff8e6;border:1px solid #f5e0a8;color:#8a5b00;font-size:12px;
        line-height:1.7;padding:9px 11px;border-radius:8px;margin-bottom:16px}
  .hint b{color:#6b4600}
  .tip{margin-top:18px;color:#9aa0a6;font-size:11px;line-height:1.6}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>Buddy 签到管理台</h1>
  <div class="sub">输入管理密码继续</div>
  <div class="hint">{{HINT}}</div>
  <label for="pwd">管理密码</label>
  <input id="pwd" type="password" autocomplete="current-password" autofocus placeholder="请输入管理密码">
  <button id="btn" type="submit">登录</button>
  <div class="err" id="err">{{ERR}}</div>
  <div class="tip">登录状态保持 7 天，密码可在管理台「设置」里修改。</div>
</form>
<script>
const f = document.getElementById('f'), pwd = document.getElementById('pwd');
const btn = document.getElementById('btn'), err = document.getElementById('err');

function show(msg){
  err.textContent = msg;
  err.style.display = msg ? 'block' : 'none';
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  if(!pwd.value){ show('请输入密码'); return; }
  btn.disabled = true; btn.textContent = '登录中…';
  try{
    const r = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pwd.value})
    });
    const ct = r.headers.get('content-type') || '';
    if(ct.includes('application/json')){
      const d = await r.json();
      if(d.ok){ location.replace('/'); return; }
      show(d.error || '登录失败');
    }else{
      // 服务端直接回了登录页（密码错误），整页替换
      document.open(); document.write(await r.text()); document.close();
      return;
    }
  }catch(ex){
    show('网络错误：' + ex.message);
  }
  btn.disabled = false; btn.textContent = '登录';
});
</script>
</body>
</html>
